<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="portfolio.svg?v=1" />
    <title>Page Not Found &mdash; Mark Muhwezi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style media="screen">
      :root {
        --bg-color: #0a0a0a;
        --text-primary: #ffffff;
        --text-secondary: #a1a1aa;
        --accent-primary: #00f2ff;
        --accent-secondary: #7000ff;
        --card-border: rgba(255, 255, 255, 0.05);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg-color);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        position: relative;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.35;
        z-index: 0;
      }
      .orb-1 {
        width: 400px; height: 400px;
        background: var(--accent-primary);
        top: -120px; left: -120px;
      }
      .orb-2 {
        width: 460px; height: 460px;
        background: var(--accent-secondary);
        bottom: -140px; right: -140px;
      }
      #message {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid var(--card-border);
        max-width: 520px;
        padding: 48px 36px;
        border-radius: 24px;
        text-align: center;
      }
      #message h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 80px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #message h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      #message p {
        color: var(--text-secondary);
        margin: 0 0 28px;
        font-size: 15px;
      }
      #message a {
        display: inline-block;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        text-transform: uppercase;
        text-decoration: none;
        color: #fff;
        padding: 13px 30px;
        border-radius: 50px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
      }
      #message a:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
      }
      @media (hover: none) {
        #message a:hover { transform: none; }
      }
      @media (max-width: 600px) {
        #message { padding: 40px 24px; }
        #message h2 { font-size: 60px; }
        #message h1 { font-size: 22px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>That link doesn't lead anywhere. It may have moved, or it never existed.</p>
      <a href="/">&larr; Back to Home</a>
    </div>
  </body>
</html>
